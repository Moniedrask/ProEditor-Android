// build.gradle (ROOT) - Solo configuración de plugins
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.0.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0'
    }
}

// ✅ NO agregues 'allprojects { repositories {...} }' aquí
// Los repositorios ya están definidos en settings.gradle

task clean(type: Delete) {
    delete rootProject.buildDir
}
