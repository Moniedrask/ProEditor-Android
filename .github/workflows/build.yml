name: Android Build CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle Wrapper
      run: |
        mkdir -p gradle/wrapper
        
        if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          echo "Descargando gradle-wrapper.jar..."
          wget -q https://github.com/gradle/gradle/raw/v8.0.0/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
        fi
        
        if [ ! -f "gradlew" ]; then
          echo "Descargando gradlew..."
          wget -q https://raw.githubusercontent.com/gradle/gradle/v8.0.0/gradlew
          chmod +x gradlew
        fi
        
        if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
          echo "Creando gradle-wrapper.properties..."
          echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
        fi
        
        chmod +x gradlew
        echo "Gradle wrapper configurado"

    - name: Accept Android Licenses
      run: yes | sdkmanager --licenses || true

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --console=plain

    - name: Verify APK Exists
      run: |
        if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          echo "APK generado exitosamente"
          ls -lh app/build/outputs/apk/debug/app-debug.apk
        else
          echo "APK no encontrado"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pro-editor-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
