plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.proeditor'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.proeditor"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        viewBinding { enabled = true }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

// ✅ Repositorios a nivel de módulo (necesario para ffmpeg-kit)
repositories {
    google()
    mavenCentral()
    maven { url 'https://arthenica.com/maven' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // ✅ Versión LTS estable de ffmpeg-kit
    implementation 'com.arthenica:ffmpeg-kit-full:6.0.LTS'
}
